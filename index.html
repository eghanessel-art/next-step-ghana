.two{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-bottom:10px}
.btn{display:block;width:100%;min-height:52px;padding:12px;border:0;border-radius:14px;background:var(--accent);color:var(--onacc);font-weight:600;font-size:1.05rem;cursor:pointer;text-align:center;text-decoration:none}

.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:68px;padding:10px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:left;font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{flex:none;min-height:40px;padding:6px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.scale{height:12px;border-radius:6px;background:linear-gradient(90deg,#1f9d6b,#fcd116 55%,#ce1126);position:relative;margin:14px 4px 6px}
.scale i{position:absolute;top:-6px;width:8px;height:24px;border-radius:4px;background:var(--ink);border:2px solid var(--card);transform:translateX(-50%)}
.row{display:flex;justify-content:space-between}
.big{font:800 3.2rem/1 "Bricolage Grotesque",system-ui,sans-serif}
.tag{display:inline-block;font-size:.85rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}

nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
ol{padding-left:20px;margin:0 0 10px}

function knust(agg,ok,area){
 if(!ok||agg>24)return '';
 var subs=['e1','e2','e3'].map(function(k){return {n:st.sub[k],g:+st.v[k]}}),sci=+st.v.sc;
 var r=K.filter(function(p){return(area==='any'||p[1]===area)&&fit(p[3],subs,sci)});
 var g=[[],[],[]];r.forEach(function(p){g[agg<=p[2]?0:agg<=p[2]+3?1:2].push(p)});
 var T=['Meets last year’s cut-off','Close to the cut-off','Above last year’s cut-off (a stretch)'],L=['Good fit','Close','Stretch'];
 var h='<h2>KNUST, Kumasi</h2><p class="small mute">'+r.length+' programme'+(r.length===1?'':'s')+' match your subjects and aggregate. Cut-off points are from KNUST’s published 2024/25 admissions and change every year.</p>';
 g.forEach(function(a,i){if(!a.length)return;a.sort(function(x,y){return x[2]-y[2]});h+='<h2>'+T[i]+' ('+a.length+')</h2>'+a.map(function(p){return '<div class="card u"><h3>'+p[0]+'</h3><div class="m">Last year’s cut-off: '+p[2]+'</div>'+(p[4]?'<p class="small">'+p[4]+'</p>':'')+'<span class="tag'+(i?' w':'')+'">'+L[i]+'</span></div>'}).join('')});
 if(!r.length)h+='<div class="card"><p>No KNUST programme matches your electives in this study area. Try another study area above.</p></div>';
 return h}
var st={t:'u',step:0,v:{},sub:{},prog:'',area:'any',res:false,wf:'',wl:'',q:''},ip=null;

function sel(id,val){return '<select id="'+id+'" onchange="st.v.'+id+'=this.value" aria-label="Grade"><option value="">Grade</option>'+G.map(function(g,i){return '<option value="'+(i+1)+'"'+(val==(i+1)?' selected':'')+'>'+g+'</option>'}).join('')+'</select>'}
function prog(){return '<div class="prog">'+[0,1,2].map(function(i){return '<i class="'+(i<=st.step?'on':'')+'"></i>'}).join('')+'</div>'}
function go(t){st.t=t;render();window.scrollTo(0,0)}
function chips(arr,cur,fn){return '<div class="chips">'+arr.map(function(a){return '<button class="chip" aria-pressed="'+(cur===a[0])+'" onclick="'+fn+'(\''+a[0]+'\')">'+a[1]+'</button>'}).join('')+'</div>'}

function view(){
 if(st.t==='s')return schView();
 if(st.t==='m')return moreView();
 if(st.res)return resView();
 var s=st.step,h='<h1>'+['Your core subjects','Your best 3 electives','What do you want to study?'][s]+'</h1>'+prog();
 if(s===0){h+='<p class="mute">Choose your WASSCE grade for each subject.</p><div class="card">'+
  [['en','English Language'],['ma','Core Mathematics'],['sc','Integrated Science or Social Studies']].map(function(x){return '<div class="fld"><label>'+x[1]+'</label>'+sel(x[0],st.v[x[0]])+'</div>'}).join('')+'</div><button class="btn" onclick="nx()">Next</button>'}
 if(s===1){var P=st.prog,L=P?EL[P]:[];h+='<p class="mute">Choose your SHS programme, then your three elective subjects and their grades.</p><div class="card"><div class="fld"><label>Your SHS programme</label><select id="prog" onchange="pickProg(this.value)" aria-label="SHS programme"><option value="">Choose programme</option>'+Object.keys(EL).map(function(k){return '<option'+(P===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div>'+(P?['e1','e2','e3'].map(function(k){return '<div class="two">'+subSel(k,L)+sel(k,st.v[k])+'</div>'}).join(''):'<p class="small mute">Choose a programme to see its elective subjects.</p>')+'</div><div class="btns"><button class="btn o" onclick="st.step=0;render()">Back</button><button class="btn" onclick="nx()">Next</button></div>'}
 if(s===2){h+='<p class="mute">This helps me show the right universities first.</p><div class="opts">'+AREAS.map(function(a){return '<button class="opt" aria-pressed="'+(st.area===a[0])+'" onclick="st.area=\''+a[0]+'\';render()">'+a[2]+' '+a[1]+'</button>'}).join('')+'</div><div class="btns" style="margin-top:14px"><button class="btn o" onclick="st.step=1;render()">Back</button><button class="btn" onclick="st.res=true;render()">See my options</button></div>'}
 return h+'<p class="small mute" id="msg" style="margin-top:12px"></p>';
}
function pickProg(v){st.prog=v;st.sub={};st.v.e1=st.v.e2=st.v.e3='';render()}
function nx(){
 var m=$('#msg');function er(t){m.innerHTML='<span class="err">'+t+'</span>'}
 if(st.step===0){if(['en','ma','sc'].some(function(k){return !st.v[k]})){er('Choose a grade for every subject to continue.');return}}
 else{var ks=['e1','e2','e3'];
  if(!st.prog){er('Choose your SHS programme to continue.');return}
  if(ks.some(function(k){return !st.sub[k]||!st.v[k]})){er('Choose a subject and a grade for all three electives.');return}
  if(new Set(ks.map(function(k){return st.sub[k]})).size<3){er('Choose three different subjects.');return}}
 st.step++;render();window.scrollTo(0,0);
}
function areaSet(a){st.area=a;render()}
function resView(){
 var v=['en','ma','sc','e1','e2','e3'].map(function(k){return +st.v[k]});
 var agg=v.reduce(function(a,b){return a+b},0),coreOK=v.slice(0,3).every(function(x){return x<=6}),area=st.area;
 var band=agg<=12?'Very strong':agg<=18?'Strong':agg<=24?'Within the usual degree range':'Above the usual degree limit';
 var h='<h1>Your results</h1><div class="card"><div class="row" style="align-items:flex-end"><div><div class="mute small">Your aggregate</div><div class="big">'+agg+'</div></div><span class="tag'+(agg>24?' w':'')+'">'+band+'</span></div>'+
 '<div class="scale"><i style="left:'+((agg-6)/30*100)+'%"></i></div><div class="row small mute"><span>6 (best)</span><span>36</span></div>';
 if(!coreOK)h+='<p class="warn" style="margin-top:10px">Most degree programmes need at least a credit (C6) in English, Mathematics and Science or Social Studies. Consider resitting the weaker subject, and ask universities about diploma or HND routes.</p>';
 else if(agg>24)h+='<p class="warn" style="margin-top:10px">Most universities ask for an aggregate of about 24 or lower for degrees. Technical universities and HND routes may still be open to you, and a resit can improve your options.</p>';
 h+='<p class="small mute" style="margin-top:10px">Your electives: '+['e1','e2','e3'].map(function(k){return st.sub[k]+' ('+G[st.v[k]-1]+')'}).join(', ')+'</p>';
 if(ADV[area])h+='<p class="small mute">'+ADV[area]+'</p>';
 if(area==='health'&&agg>12)h+='<p class="small mute">Medicine and dentistry are the most competitive programmes and usually need a very low aggregate. Nursing, physician assistantship, medical laboratory science and pharmacy are other routes to ask about.</p>';
 h+='</div><h2>Filter by study area</h2>'+chips(AREAS.map(function(a){return [a[0],a[1].split(',')[0]]}),area,'areaSet');
 h+=knust(agg,coreOK,area);var low=!coreOK||agg>24,list=(low?U.filter(function(u){return u.tech}):U.filter(function(u){return area==='any'||u.a.indexOf(area)>-1})).filter(function(u){return u.n!=='KNUST'});if(list.length)h+='<h2>Other universities</h2><p class="small mute">Course-by-course matching for these is coming soon.</p>';
 list.forEach(function(u){
  var t=low?'<span class="tag w">Diploma or HND route</span>':(u.hd&&agg>14)?'<span class="tag w">Competitive for you</span>':'<span class="tag">Worth applying</span>';
  h+='<div class="card u"><h3>'+u.n+'</h3><div class="m">'+u.c+'</div><p>'+u.k+'</p>'+t+''+'</div>';
 });
 return h+'<div class="btns"><button class="btn o" onclick="st.res=false;st.step=0;render();window.scrollTo(0,0)">Start over</button><a class="btn" href="'+wa()+'" target="_blank" rel="noopener">Share on WhatsApp</a></div><p class="small mute" style="margin-top:12px">Your grades stay on your phone. Cut-offs change every year and differ by programme, so this is a guide, not an admission decision. Confirm on each university’s admissions page.</p>';
}
function setF(k,x){st[k]=x==='all'?'':x;render()}
function schView(){
 var r=S.filter(function(s){return(!st.wf||s.w===st.wf)&&(!st.wl||s.l.indexOf(st.wl)>-1)&&(!st.q||(s.n+' '+s.d).toLowerCase().indexOf(st.q.toLowerCase())>-1)});
 var h='<h1>Scholarships for graduates</h1><p class="mute">For master’s and PhD study abroad.</p><input type="text" id="q" placeholder="Search scholarships" value="'+st.q+'" oninput="st.q=this.value;clearTimeout(window.tq);window.tq=setTimeout(function(){render();var e=$(\'#q\');e.focus();e.setSelectionRange(99,99)},350)" aria-label="Search scholarships" style="margin-bottom:10px">';
 h+=chips([['all','Anywhere']].concat(['UK','Germany','USA','Europe','Asia','Africa'].map(function(x){return [x,x]})),st.wf||'all','setWF')+chips([['all','Any level'],['Master’s','Master’s'],['PhD','PhD']],st.wl||'all','setWL');
 h+=r.length?r.map(function(s){return '<div class="card u"><h3>'+s.n+'</h3><div class="m">'+s.w+' · '+s.l.join(', ')+'</div><p>'+s.d+'</p><a href="'+s.u+'" target="_blank" rel="noopener">Official site</a></div>'}).join(''):'<div class="card"><p>No scholarships match. Try a different place or level.</p></div>';
 return h+'<div class="card"><h2 style="margin-top:0">Before you apply</h2><p>Most look for strong grades (often second class upper or better), a clear study plan and good recommendation letters. Start preparing 9 to 12 months before the deadline.</p><p class="small mute">Deadlines, amounts and eligibility change every year, so always confirm on the official site.</p></div>';
}
function setWF(x){setF('wf',x)}function setWL(x){setF('wl',x)}
function wa(){return 'https://wa.me/?text='+encodeURIComponent('Find Ghanaian universities that fit your WASSCE results, and scholarships for graduates: '+location.href.split('#')[0])}
function moreView(){
 return '<h1>Share and install</h1><div class="card"><h2 style="margin-top:0">Share with friends</h2><p class="mute">Send this site to students who are choosing a university.</p><a class="btn" href="'+wa()+'" target="_blank" rel="noopener">Share on WhatsApp</a></div>'+
 '<div class="card"><h2 style="margin-top:0">Install as an app</h2>'+(ip?'<button class="btn" onclick="inst()">Install app</button>':'<ol><li><b>iPhone (Safari):</b> tap Share, then Add to Home Screen.</li><li><b>Android (Chrome):</b> tap the menu, then Install app.</li></ol>')+'</div>'+
 '<div class="card"><h2 style="margin-top:0">About</h2><p class="small mute">Next Step Ghana is a guide to help you shortlist universities and scholarships. Information changes often, so always confirm details on the official websites before you apply.</p></div>';
}
function inst(){if(ip){ip.prompt();ip=null;render()}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ip=e;if(st.t==='m')render()});
function render(){
 $('#app').innerHTML=view();
 document.querySelectorAll('nav button').forEach(function(b){b.getAttribute('data-t')===st.t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
}
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
